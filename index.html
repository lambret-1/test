<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNS 30秒可视化测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 16px;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #64748b; font-size: 13px; margin-bottom: 24px; }

        /* 顶部控制区 */
        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: #fff;
            border: none;
            padding: 10px 28px;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn:hover { transform: scale(1.04); box-shadow: 0 4px 20px rgba(99,102,241,0.4); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .timer {
            font-size: 32px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: #38bdf8;
            min-width: 80px;
            text-align: center;
        }
        .progress-bar {
            width: 100%;
            max-width: 560px;
            height: 6px;
            background: #1e293b;
            border-radius: 3px;
            margin-bottom: 28px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            border-radius: 3px;
            transition: width 0.3s linear;
        }

        /* 图表区 */
        .charts { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 20px; }
        .chart-box {
            background: #1e293b;
            border-radius: 14px;
            padding: 16px;
            border: 1px solid #334155;
        }
        .chart-title {
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chart-title .avg { font-size: 18px; font-weight: 700; }
        canvas { width: 100% !important; height: 160px !important; }

        /* 统计卡片 */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 560px;
            margin-top: 20px;
        }
        .stat-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            border: 1px solid #334155;
        }
        .stat-label { font-size: 11px; color: #64748b; margin-bottom: 4px; }
        .stat-value { font-size: 20px; font-weight: 700; }
        .stat-value.green { color: #22c55e; }
        .stat-value.yellow { color: #eab308; }
        .stat-value.red { color: #ef4444; }

        .note {
            margin-top: 24px;
            font-size: 11px;
            color: #475569;
            text-align: center;
            max-width: 560px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <h1>⚡ DNS 30秒可视化测试</h1>
    <p class="subtitle">持续 30 秒采样，实时绘制延迟曲线</p>

    <div class="controls">
        <button class="btn" id="startBtn" onclick="startTest()">开始测试</button>
        <div class="timer" id="timer">30s</div>
    </div>

    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

    <div class="charts">
        <div class="chart-box">
            <div class="chart-title">
                <span>阿里 DNS (223.5.5.5)</span>
                <span class="avg" id="avg-ali" style="color:#22c55e">-- ms</span>
            </div>
            <canvas id="chart-ali"></canvas>
        </div>
        <div class="chart-box">
            <div class="chart-title">
                <span>腾讯 DNSPod (119.29.29.29)</span>
                <span class="avg" id="avg-tx" style="color:#38bdf8">-- ms</span>
            </div>
            <canvas id="chart-tx"></canvas>
        </div>
        <div class="chart-box">
            <div class="chart-title">
                <span>Cloudflare (1.1.1.1)</span>
                <span class="avg" id="avg-cf" style="color:#818cf8">-- ms</span>
            </div>
            <canvas id="chart-cf"></canvas>
        </div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-label">最快</div>
            <div class="stat-value green" id="statMin">--</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">平均</div>
            <div class="stat-value yellow" id="statAvg">--</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">最慢</div>
            <div class="stat-value red" id="statMax">--</div>
        </div>
    </div>

    <p class="note">
        测试原理：每 1 秒向各 DoH 服务器发起 HTTPS 请求，测量握手+响应耗时。 
        共采样 30 次，自动绘制实时曲线并计算统计值。
    </p>

    <script>
        const DURATION = 30;
        const INTERVAL = 1000;

        const servers = [
            { key: 'ali', name: '阿里 DNS', url: 'https://dns.alidns.com/resolve?name=www.baidu.com', color: '#22c55e', data: [] },
            { key: 'tx',  name: '腾讯 DNS', url: 'https://doh.pub/resolve?name=www.baidu.com',        color: '#38bdf8', data: [] },
            { key: 'cf',  name: 'Cloudflare', url: 'https://1.1.1.1/dns-query?name=www.google.com&type=A', color: '#818cf8', data: [] },
        ];

        let timer = null;
        let elapsed = 0;
        let running = false;

        // ---- Canvas 绘图 ----
        function drawChart(canvasId, data, color) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);

            const w = rect.width;
            const h = rect.height;
            const pad = { top: 10, right: 10, bottom: 24, left: 40 };
            const plotW = w - pad.left - pad.right;
            const plotH = h - pad.top - pad.bottom;

            ctx.clearRect(0, 0, w, h);

            if (data.length === 0) {
                ctx.fillStyle = '#475569';
                ctx.font = '13px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('等待测试...', w / 2, h / 2);
                return;
            }

            const maxVal = Math.max(...data.filter(v => v !== null), 50);
            const yScale = plotH / (maxVal * 1.15);

            // 网格线
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= 4; i++) {
                const y = pad.top + (plotH / 4) * i;
                ctx.beginPath();
                ctx.moveTo(pad.left, y);
                ctx.lineTo(w - pad.right, y);
                ctx.stroke();

                ctx.fillStyle = '#64748b';
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'right';
                const label = Math.round(maxVal * 1.15 * (1 - i / 4));
                ctx.fillText(label + 'ms', pad.left - 4, y + 3);
            }

            // X 轴标签
            ctx.fillStyle = '#64748b';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'center';
            for (let i = 0; i < DURATION; i += 5) {
                const x = pad.left + (plotW / (DURATION - 1)) * i;
                ctx.fillText((i + 1) + 's', x, h - 4);
            }

            // 数据线
            const points = [];
            data.forEach((v, i) => {
                if (v === null) return;
                const x = pad.left + (plotW / (DURATION - 1)) * i;
                const y = pad.top + plotH - v * yScale;
                points.push({ x, y });
            });

            if (points.length > 1) {
                // 填充区域
                ctx.beginPath();
                ctx.moveTo(points[0].x, pad.top + plotH);
                points.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.lineTo(points[points.length - 1].x, pad.top + plotH);
                ctx.closePath();
                const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + plotH);
                grad.addColorStop(0, color + '40');
                grad.addColorStop(1, color + '05');
                ctx.fillStyle = grad;
                ctx.fill();

                // 线条
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.lineJoin = 'round';
                ctx.stroke();
            }

            // 最新点
            if (points.length > 0) {
                const last = points[points.length - 1];
                ctx.beginPath();
                ctx.arc(last.x, last.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // ---- 单次 ping ----
        async function ping(url) {
            const start = performance.now();
            try {
                await fetch(url, { method: 'GET', mode: 'no-cors', cache: 'no-store' });
                return Math.round(performance.now() - start);
            } catch (e) {
                return null;
            }
        }

        // ---- 一轮测试 ----
        async function tick() {
            if (elapsed >= DURATION) {
                stopTest();
                return;
            }

            for (const s of servers) {
                const ms = await ping(s.url);
                s.data.push(ms);
                drawChart('chart-' + s.key, s.data, s.color);

                // 更新平均值
                const valid = s.data.filter(v => v !== null);
                if (valid.length > 0) {
                    const avg = Math.round(valid.reduce((a, b) => a + b, 0) / valid.length);
                    document.getElementById('avg-' + s.key).textContent = avg + ' ms';
                }
            }

            elapsed++;
            document.getElementById('timer').textContent = (DURATION - elapsed) + 's';
            document.getElementById('progressFill').style.width = (elapsed / DURATION * 100) + '%';

            updateStats();
        }

        function updateStats() {
            const all = servers.flatMap(s => s.data.filter(v => v !== null));
            if (all.length === 0) return;
            document.getElementById('statMin').textContent = Math.min(...all) + ' ms';
            document.getElementById('statAvg').textContent = Math.round(all.reduce((a, b) => a + b, 0) / all.length) + ' ms';
            document.getElementById('statMax').textContent = Math.max(...all) + ' ms';
        }

        // ---- 开始 / 停止 ----
        function startTest() {
            if (running) return;
            running = true;
            elapsed = 0;

            servers.forEach(s => s.data = []);
            document.getElementById('startBtn').disabled = true;
            document.getElementById('startBtn').textContent = '测试中...';
            document.getElementById('timer').textContent = DURATION + 's';
            document.getElementById('progressFill').style.width = '0%';

            ['ali', 'tx', 'cf'].forEach(k => {
                drawChart('chart-' + k, [], '#64748b');
                document.getElementById('avg-' + k).textContent = '-- ms';
            });
            document.getElementById('statMin').textContent = '--';
            document.getElementById('statAvg').textContent = '--';
            document.getElementById('statMax').textContent = '--';

            tick();
            timer = setInterval(tick, INTERVAL);
        }

        function stopTest() {
            clearInterval(timer);
            running = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('startBtn').textContent = '重新测试';
            document.getElementById('timer').textContent = '完成';
        }

        // 初始化空图表
        ['ali', 'tx', 'cf'].forEach(k => drawChart('chart-' + k, [], '#64748b'));
    </script>
</body>
</html>
