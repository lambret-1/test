<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNS 延迟测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #64748b; font-size: 14px; margin-bottom: 32px; }
        .btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: #fff;
            border: none;
            padding: 12px 36px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 32px;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn:hover { transform: scale(1.04); box-shadow: 0 4px 24px rgba(99,102,241,0.4); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .cards { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 480px; }
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
            transition: border-color 0.3s;
        }
        .card.testing { border-color: #3b82f6; }
        .card.success { border-color: #22c55e; }
        .card.fail { border-color: #ef4444; }
        .card-info { display: flex; flex-direction: column; gap: 4px; }
        .card-name { font-size: 16px; font-weight: 600; }
        .card-url { font-size: 12px; color: #64748b; word-break: break-all; }
        .card-result {
            font-size: 22px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            min-width: 90px;
            text-align: right;
        }
        .card-result.ok { color: #22c55e; }
        .card-result.err { color: #ef4444; }
        .card-result.pending { color: #3b82f6; }
        .note {
            margin-top: 32px;
            font-size: 12px;
            color: #475569;
            text-align: center;
            max-width: 480px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>⚡ DNS 延迟测试</h1>
    <p class="subtitle">通过 HTTPS 握手测量各 DoH 服务器响应速度</p>

    <button class="btn" id="startBtn" onclick="runAll()">开始测试</button>

    <div class="cards" id="cards"></div>

    <p class="note">
        ⚠️ 原理：向各 DoH 服务器发起 HTTPS 请求，测量从发起到收到首个响应字节的耗时。 
        数值越低越好。国内服务器（阿里/腾讯）在部分浏览器中可能因 CORS 策略显示超时，属正常现象。
    </p>

    <script>
        const servers = [
            { name: '阿里 DNS',      url: 'https://dns.alidns.com/resolve?name=www.baidu.com' },
            { name: '腾讯 DNSPod',   url: 'https://doh.pub/resolve?name=www.baidu.com' },
            { name: 'Cloudflare',    url: 'https://1.1.1.1/dns-query?name=www.google.com' },
            { name: 'Google DNS',    url: 'https://dns.google/resolve?name=www.google.com' },
            { name: 'System DNS',    url: window.location.origin + '/favicon.ico' },
        ];

        const cardsEl = document.getElementById('cards');
        const btnEl   = document.getElementById('startBtn');

        // 初始化卡片
        servers.forEach((s, i) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.id = 'card-' + i;
            card.innerHTML = `
                <div class="card-info">
                    <div class="card-name">${s.name}</div>
                    <div class="card-url">${s.url}</div>
                </div>
                <div class="card-result pending" id="result-${i}">待测试</div>
            `;
            cardsEl.appendChild(card);
        });

        async function ping(url) {
            const start = performance.now();
            try {
                await fetch(url, { method: 'GET', mode: 'no-cors', cache: 'no-store' });
                const ms = Math.round(performance.now() - start);
                return { ok: true, ms };
            } catch (e) {
                const ms = Math.round(performance.now() - start);
                return { ok: false, ms };
            }
        }

        async function runAll() {
            btnEl.disabled = true;
            btnEl.textContent = '测试中...';

            for (let i = 0; i < servers.length; i++) {
                const cardEl   = document.getElementById('card-' + i);
                const resultEl = document.getElementById('result-' + i);

                cardEl.className = 'card testing';
                resultEl.className = 'card-result pending';
                resultEl.textContent = '测试中...';

                const res = await ping(servers[i].url);

                cardEl.className = 'card ' + (res.ok ? 'success' : 'fail');
                resultEl.className = 'card-result ' + (res.ok ? 'ok' : 'err');
                resultEl.textContent = res.ok ? res.ms + ' ms' : '超时/失败';
            }

            btnEl.disabled = false;
            btnEl.textContent = '重新测试';
        }
    </script>
</body>
</html>
